<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Register Your Password</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td align="center" style="padding: 40px 0;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:600px; background:#ffffff; border-radius:8px; padding:20px; font-family:Arial, sans-serif;">
            
            <!-- Heading -->
            <tr>
              <td align="center" style="padding-bottom: 20px;">
                <h2 style="margin:0; font-size:24px; color:#333;">Welcome! Set Your Password</h2>
              </td>
            </tr>

            <!-- Description -->
            <tr>
              <td align="center" style="padding: 0 20px 30px 20px;">
                <p style="margin:0; font-size:16px; line-height:24px; color:#555;">
                  Your account has been created successfully. Before you can log in, you need to set your password.
                  Click the button below to register your password and complete your account setup.
                </p>
              </td>
            </tr>

            <!-- Button -->
            <tr>
              <td align="center">
                <a href="{{REGISTER_LINK}}" 
                   style="display:inline-block; padding:12px 24px; background:#28a745; color:#ffffff; text-decoration:none; border-radius:5px; font-size:16px;">
                  Register Password
                </a>
              </td>
            </tr>

            <!-- Note -->
            <tr>
              <td align="center" style="padding-top:20px;">
                <p style="margin:0; font-size:14px; line-height:20px; color:#888;">
                  If you didn’t create this account, please ignore this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
