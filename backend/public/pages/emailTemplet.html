<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Forgot Password</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td align="center" style="padding: 40px 0;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:600px; background:#ffffff; border-radius:8px; padding:20px; font-family:Arial, sans-serif;">
            
            <!-- Heading -->
            <tr>
              <td align="center" style="padding-bottom: 20px;">
                <h2 style="margin:0; font-size:24px; color:#333;">Forgot Password</h2>
              </td>
            </tr>

            <!-- Description -->
            <tr>
              <td align="center" style="padding: 0 20px 30px 20px;">
                <p style="margin:0; font-size:16px; line-height:24px; color:#555;">
                  You requested to reset your password. Click the button below to set a new one. If you didn’t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>

            <!-- Button -->
            <tr>
              <td align="center">
                <a href="{{RESET_LINK}}" 
                   style="display:inline-block; padding:12px 24px; background:#007bff; color:#ffffff; text-decoration:none; border-radius:5px; font-size:16px;">
                  Reset Password
                </a>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
